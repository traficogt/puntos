components:
  securitySchemes:
    staffAuth:
      type: apiKey
      in: cookie
      name: __Host-pf_staff
    customerAuth:
      type: apiKey
      in: cookie
      name: __Host-pf_customer
    superAuth:
      type: apiKey
      in: cookie
      name: __Host-pf_super
  schemas:
    StaffLoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - email
        - password
      additionalProperties: false
    AwardPointsRequest:
      type: object
      properties:
        customerQrToken:
          type: string
          minLength: 1
        amount_q:
          type: number
          minimum: 0
          maximum: 1000000
        visits:
          type: integer
          exclusiveMinimum: 0
          maximum: 1000
        items:
          type: integer
          exclusiveMinimum: 0
          maximum: 10000
        meta:
          type: object
          additionalProperties:
            {}
        txId:
          type: string
          format: uuid
      required:
        - customerQrToken
        - txId
      additionalProperties: false
    StaffRedeemRequest:
      type: object
      properties:
        customerId:
          type: string
          format: uuid
        rewardId:
          $ref: "#/definitions/StaffRedeemRequest/properties/customerId"
        requestId:
          $ref: "#/definitions/StaffRedeemRequest/properties/customerId"
      required:
        - customerId
        - rewardId
        - requestId
      additionalProperties: false
    StaffSyncAwardsRequest:
      type: object
      properties:
        awards:
          type: array
          items:
            type: object
            properties:
              txId:
                type: string
                format: uuid
              customerQrToken:
                type: string
                minLength: 20
              amount_q:
                type: number
                minimum: 0
              visits:
                type: integer
                exclusiveMinimum: 0
              items:
                type: integer
                exclusiveMinimum: 0
              meta:
                {}
              client_ts:
                type: string
            required:
              - txId
              - customerQrToken
            additionalProperties: false
          maxItems: 200
      required:
        - awards
      additionalProperties: false
    StaffRefundRequest:
      type: object
