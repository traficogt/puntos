        password:
          type: string
          minLength: 1
          maxLength: 128
        mfaCode:
          type: string
          pattern: "^\\d{6}$"
      required:
        - email
        - password
      additionalProperties: false
    AwardPointsRequest:
      type: object
      properties:
        customerQrToken:
          type: string
          minLength: 1
        amount_q:
          type: number
          minimum: 0
          maximum: 1000000
        visits:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 1000
        items:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 10000
        meta:
          type: object
          additionalProperties:
            {}
        txId:
          type: string
          format: uuid
          pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$"
      required:
