services:
  db:
    image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    restart: unless-stopped
    environment:
      POSTGRES_DB: puntos_e2e
      POSTGRES_USER: loyalty_admin
      POSTGRES_PASSWORD: ${E2E_DB_ADMIN_PASSWORD:?set E2E_DB_ADMIN_PASSWORD}
      E2E_APP_DB_PASSWORD: ${E2E_APP_DB_PASSWORD:?set E2E_APP_DB_PASSWORD}
      TZ: America/Guatemala
    volumes:
      - pgdata_e2e:/var/lib/postgresql/data
      - ./deploy/db/init-e2e.sh:/docker-entrypoint-initdb.d/init-e2e.sh:ro
    expose:
      - "5432"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - db
      - redis
    ports:
      - "${E2E_PORT:-3101}:3001"
    env_file:
      - ./deploy/e2e/api.env
    environment:
      DB_USER: loyalty_app
      DB_PASSWORD: ${E2E_APP_DB_PASSWORD:?set E2E_APP_DB_PASSWORD}
      DB_MIGRATIONS_USER: loyalty_admin
      DB_MIGRATIONS_PASSWORD: ${E2E_DB_ADMIN_PASSWORD:?set E2E_DB_ADMIN_PASSWORD}
      SUPER_ADMIN_PASSWORD: ${E2E_SUPER_ADMIN_PASSWORD:?set E2E_SUPER_ADMIN_PASSWORD}
      # Allow both host-run Playwright (localhost:<E2E_PORT>) and in-network Playwright (api:3001).
      CORS_ORIGIN: "http://localhost:${E2E_PORT:-3101},http://api:3001"
      APP_ORIGIN: "http://localhost:${E2E_PORT:-3101}"
      MARKETING_ORIGIN: "http://localhost:${E2E_PORT:-3101}"
      IN_PROCESS_WORKERS: "false"

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      - db
      - redis
      - api
    command: ["node", "src/app/worker.js"]
    ports:
      - "${E2E_WORKER_PORT:-3102}:3002"
    env_file:
      - ./deploy/e2e/api.env
    environment:
      DB_USER: loyalty_app
      DB_PASSWORD: ${E2E_APP_DB_PASSWORD:?set E2E_APP_DB_PASSWORD}
      DB_MIGRATIONS_USER: loyalty_admin
      DB_MIGRATIONS_PASSWORD: ${E2E_DB_ADMIN_PASSWORD:?set E2E_DB_ADMIN_PASSWORD}
      SUPER_ADMIN_PASSWORD: ${E2E_SUPER_ADMIN_PASSWORD:?set E2E_SUPER_ADMIN_PASSWORD}
      WORKER_PORT: 3002
      HEALTHCHECK_PORT: 3002
      HEALTHCHECK_PATH: /health

  redis:
    image: redis:7-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
    restart: unless-stopped
    expose:
      - "6379"

  e2e:
    # Use the official Playwright image so browsers are available without downloading at runtime.
    image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
    depends_on:
      - api
    working_dir: /work
    volumes:
      - ./:/work
    environment:
      # Inside the compose network, target the API service directly.
      E2E_BASE_URL: http://api:3001
      # Keep test runner credentials in sync with the API container.
      # (dotenv in playwright.config.mjs does not override already-set env vars.)
      SUPER_ADMIN_EMAIL: super@example.com
      SUPER_ADMIN_PASSWORD: ${E2E_SUPER_ADMIN_PASSWORD:?set E2E_SUPER_ADMIN_PASSWORD}
    entrypoint: ["bash", "-lc"]

volumes:
  pgdata_e2e:
