worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
  resolver 127.0.0.11 valid=30s ipv6=off;
  # Trust only our edge VM and Cloudflare's published proxy ranges.
  # Verified 2026-11-12: https://www.cloudflare.com/ips/
  # Resolve X-Forwarded-For from the right, stopping at an untrusted peer.
  set_real_ip_from 10.10.1.3;
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  map $host $search_visibility {
    default "noindex, nofollow";
    pertenecegt.com "index, follow, max-image-preview:large";
  }
  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    client_max_body_size 16k;
    add_header X-Robots-Tag $search_visibility always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://static.cloudflareinsights.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com https://cloudflareinsights.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = / { try_files /credenciales/index.html =404; }
    location = /index.html { return 308 https://pertenecegt.com/$is_args$args; }
    location = /credenciales { return 308 https://pertenecegt.com/$is_args$args; }
    location = /credenciales/ { return 308 https://pertenecegt.com/$is_args$args; }
    location = /credenciales/index.html { return 308 https://pertenecegt.com/$is_args$args; }
    location = /privacidad { return 302 https://puntosfieles.com/privacidad; }
    location = /terminos { return 302 https://puntosfieles.com/terminos; }
    location = /soporte { return 302 https://puntosfieles.com/soporte; }
    location = /robots.txt {
      default_type text/plain;
      return 200 "User-agent: *\nAllow: /\n\nSitemap: https://pertenecegt.com/sitemap.xml\n";
    }
    location = /sitemap.xml {
      default_type application/xml;
      return 200 '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>https://pertenecegt.com/</loc></url></urlset>\n';
    }
    location = /api/public/contact {
      limit_except POST { deny all; }
      set $contact_upstream http://api:3001;
      proxy_pass $contact_upstream;
      proxy_set_header Host pertenecegt.com;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Cookie "";
      proxy_set_header Authorization "";
      proxy_hide_header Set-Cookie;
      proxy_read_timeout 20s;
      proxy_connect_timeout 5s;
    }
    location /api/ { return 404; }
    location /credenciales/ { try_files $uri =404; expires 1h; }
    location /fonts/ { try_files $uri =404; expires 30d; }
    location = /styles/fonts.css { try_files $uri =404; expires 1h; }
    location / { return 404; }
  }
}
