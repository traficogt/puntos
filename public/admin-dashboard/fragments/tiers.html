      <div class="tab-content" id="tiers-content">
        <div class="card">
          <h2>Gestión de Niveles</h2>
          <p class="small">Los clientes progresan automáticamente según los puntos que han ganado, no según su saldo disponible. Los niveles no multiplican los puntos de cada compra.</p>
          
          <div id="tiersList"></div>
          
          <div class="hr"></div>
          <button class="primary" id="btnAddTier">+ Agregar Nivel</button>
        </div>

        <!-- Add/Edit Tier Modal -->
        <div id="tierModal" class="card is-hidden">
          <h2 id="tierModalTitle">Nuevo Nivel</h2>
          <div class="grid">
            <div>
              <label for="tierName">Nombre</label>
              <input id="tierName" placeholder="Ej: Platino"/>
              
              <label for="tierLevel">Nivel (orden)</label>
              <input id="tierLevel" type="number" min="1" value="4" placeholder="4"/>
              
              <label for="tierMinPoints">Puntos mínimos</label>
              <input id="tierMinPoints" type="number" min="0" value="5000"/>
            </div>
            <div>
              <label for="tierMultiplier">Multiplicador de puntos (no se aplica)</label>
              <input id="tierMultiplier" type="number" step="0.25" min="1" value="1" aria-describedby="tierMultiplierHint"/>
              <p id="tierMultiplierHint" class="small">PF guarda este valor, pero no lo usa al sumar puntos. No lo anuncies como beneficio.</p>
              
              <label for="tierColor">Color (hex)</label>
              <input id="tierColor" placeholder="#E5E4E2"/>
              
              <label for="tierIcon">Icono (emoji o URL)</label>
              <input id="tierIcon" placeholder="💎"/>
            </div>
          </div>
          
          <label for="tierPerks">Beneficios (uno por línea)</label>
          <textarea id="tierPerks" rows="4" placeholder="Envío gratis&#10;Descuentos exclusivos&#10;Atención prioritaria"></textarea>
          
          <div class="row mt-16">
            <button class="primary" id="btnSaveTier">Guardar</button>
            <button id="btnCancelTier">Cancelar</button>
          </div>
        </div>
      </div>
