site_name: Ayuda PF
site_url: https://puntosfieles.com/ayuda/
site_description: Guías por tarea para el equipo de caja, dueños y clientes de PuntosFieles.
docs_dir: docs
site_dir: ../public/ayuda
use_directory_urls: true
theme:
  name: mkdocs
  custom_dir: theme
  locale: es
  highlightjs: false
plugins:
- search:
    lang:
    - es
    min_search_length: 2
    indexing: full
markdown_extensions:
- tables
- attr_list
- toc:
    permalink: false
